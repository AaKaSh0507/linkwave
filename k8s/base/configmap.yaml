apiVersion: v1
kind: ConfigMap
metadata:
  name: linkwave-config
  namespace: linkwave
  labels:
    app: linkwave
    component: config
data:
  # Database
  DATABASE_URL: "jdbc:postgresql://postgres.linkwave.svc.cluster.local:5432/linkwave"

  # Redis
  REDIS_HOST: "redis.linkwave.svc.cluster.local"
  REDIS_PORT: "6379"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka.linkwave.svc.cluster.local:9092"

  # Backend
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  COOKIE_SECURE: "true"
  COOKIE_SAME_SITE: "strict"
  MAIL_TLS_ENABLED: "true"
  LINKWAVE_MAIL_DEV_MODE: "false"
  SESSION_TIMEOUT: "30m"
  SESSION_NAMESPACE: "linkwave:session:"

  # Frontend (build-time baked, runtime reference)
  NEXT_PUBLIC_API_URL: "https://linkwave.example.com/api"
  NEXT_PUBLIC_WS_URL: "wss://linkwave.example.com/ws"
