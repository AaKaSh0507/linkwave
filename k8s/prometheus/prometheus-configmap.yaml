apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: linkwave
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "/etc/prometheus/alerts.yml"

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "linkwave-backend"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["linkwave"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: (.+):(\d+);(\d+)
            replacement: $1:$3
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

  alerts.yml: |
    groups:
      - name: linkwave-alerts
        rules:
          - alert: HighErrorRate
            expr: rate(websocket_errors_total[5m]) > 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High WebSocket error rate"

          - alert: WebSocketConnectionsDrop
            expr: delta(websocket_connections_active[5m]) < -10
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Sudden drop in WebSocket connections"

          - alert: RetentionJobFailure
            expr: increase(retention_job_executions_total{status="failure"}[1h]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Retention job failed"
