apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: hsts-headers
  namespace: linkwave
  labels:
    app: linkwave
    component: ingress
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    frameDeny: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      X-Powered-By: ""
      Server: ""
