groups:
  - name: linkwave-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(websocket_errors_total[5m]) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High WebSocket error rate"
          description: "WebSocket errors are occurring at > 1/sec for the last 2 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(websocket_message_processing_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High WebSocket message processing latency"
          description: "95th percentile message processing time exceeds 500ms."

      - alert: WebSocketConnectionsDrop
        expr: delta(websocket_connections_active[5m]) < -10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sudden drop in active WebSocket connections"
          description: "Active WebSocket connections dropped by more than 10 in 5 minutes."

      - alert: KafkaConsumerErrors
        expr: rate(kafka_errors_total{operation="consume"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer errors detected"
          description: "Kafka consumer errors exceeding 0.1/sec for 5 minutes."

      - alert: RetentionJobFailure
        expr: increase(retention_job_executions_total{status="failure"}[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Message retention job failed"
          description: "The message retention cleanup job has failed."
